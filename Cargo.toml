[workspace]
members = ["crates/music-core", "src-tauri"]
default-members = ["crates/music-core"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
log = "0.4"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
